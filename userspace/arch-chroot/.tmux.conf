set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10

# Status bar (CachyOS dark green/cyan theme for 720x720 display)
set -g status-position bottom
set -g status-interval 10
set -g status-style "bg=#111827,fg=#e5e7eb"
set -g status-left "#[bg=#10b981,fg=#000000,bold] Q25 #[bg=#111827,fg=#10b981] "
set -g status-right "#[fg=#38bdf8]#(cat /sys/class/power_supply/battery/capacity 2>/dev/null)% #[fg=#9ca3af]| #[fg=#a7f3d0]%H:%M "
setw -g window-status-current-format "#[bg=#1f2937,fg=#10b981,bold] #I:#W "
setw -g window-status-format "#[fg=#9ca3af] #I:#W "
