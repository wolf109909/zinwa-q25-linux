format = """
[╭─](bold green)$username$hostname$directory$git_branch$git_status$cmd_duration
[╰─](bold green)$character"""

[username]
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)"
 disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@q25](bold green) "
disabled = false

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
