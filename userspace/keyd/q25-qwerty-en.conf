[ids]
# Q25_Keyboard
0001:0001:45028087

[main]
send = tab
back = overload(alt, back)
homepage = overload(control, esc)
leftalt = overload(shift, oneshot(shift))
leftshift = layer(control)
0 = layer(alt)
rightalt = overload(ralt_sym_layer2, oneshot(ralt_sym_layer2))
rightshift = layer(rshift_layer3)
grave = $

[shift]
leftalt = toggle(shift)

[ralt_sym_layer2]
rightalt = toggle(ralt_sym_layer2)
leftmouse = rightmouse

q = #
w = 1
e = 2
r = 3
t = (
y = )
u = _
i = -
o = +
p = @

a = *
s = 4
d = 5
f = 6
g = /
h = :
j = ;
k = '
l = "
backspace = delete

leftalt = tab
z = 7
x = 8
c = 9
v = ?
b = !
n = ,
m = .
grave = mute

0 = 0

# Changed keycodes when sym held
up = )
left = /
home = :
right = ;
volumeup = '
volumedown = "
down = !

[rshift_layer3]
send = sysrq
homepage = A-f4
volumeup = command(/usr/local/bin/bright up)
volumedown = command(/usr/local/bin/bright down)

q = esc
w = pageup
a = home
s = pagedown
d = end

t = command(q25-togglemouse)
y = `
u = <
i = >
o = |
p = =

g = \
h = &
j = {
k = }
l = ^

n = [
m = ]

[control+alt]
homepage = command(q25-togglevt)
