# Host-side pacman config used by build-rootfs.sh to bootstrap the aarch64 rootfs.
# Package signatures are verified again inside the image after first boot keyring init.
[options]
Architecture = aarch64
HoldPkg = pacman glibc
ParallelDownloads = 8
SigLevel = Never
DisableSandbox
NoExtract = usr/lib/firmware/*  !usr/lib/firmware/regulatory.db*

[core]
Server = https://mirrors.cernet.edu.cn/archlinuxarm/$arch/$repo
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
Server = http://mirror.archlinuxarm.org/$arch/$repo
[extra]
Server = https://mirrors.cernet.edu.cn/archlinuxarm/$arch/$repo
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
Server = http://mirror.archlinuxarm.org/$arch/$repo
[alarm]
Server = https://mirrors.cernet.edu.cn/archlinuxarm/$arch/$repo
Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/$arch/$repo
Server = http://mirror.archlinuxarm.org/$arch/$repo
[archlinuxcn]
Server = https://mirrors.cernet.edu.cn/archlinuxcn/$arch
