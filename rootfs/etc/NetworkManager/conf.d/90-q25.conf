[main]
plugins=keyfile
dns=systemd-resolved
rc-manager=symlink

[device-wifi]
wifi.scan-rand-mac-address=no
# p2p0/ap0 are created by the MediaTek driver but managed by NM only via wlan0
match-device=interface-name:wlan0
wifi.backend=wpa_supplicant

[keyfile]
# ccmni* belongs to ModemManager; p2p/ap are driver companions.
unmanaged-devices=interface-name:ap0;interface-name:p2p*;interface-name:wlan1

[connectivity]
enabled=false

[connection]
# Wi-Fi power saving (driver default is off). Measured stable on the Q25:
# 0.1 % loss, 4 ms average RTT over 18 min; brief ~250 ms wake-up spikes.
wifi.powersave=3
