[options]
DisableSandbox
HoldPkg     = pacman glibc
Architecture = aarch64
IgnorePkg = linux-aarch64 linux-aarch64-headers linux-firmware linux-firmware-*
NoExtract = usr/lib/firmware/* !usr/lib/firmware/regulatory.db*
Color
ILoveCandy
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
[alarm]
Include = /etc/pacman.d/mirrorlist
