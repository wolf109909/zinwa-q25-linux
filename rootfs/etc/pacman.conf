[options]
HoldPkg     = pacman glibc
Architecture = aarch64
# kernel/firmware come from this project; modemmanager is held at the ABI
# packages/modemmanager-q25 was built against (rebuild that package first)
IgnorePkg = linux-aarch64 linux-aarch64-headers linux-firmware linux-firmware-*
IgnorePkg = modemmanager libmm-glib
# phoc is packages/phoc-q25 (phoc-patched embedded wlroots; stock ALARM phoc makes
# Phosh crash-loop); keep phosh at the matching release and rebuild phoc-q25 to bump
IgnorePkg = phoc phosh
NoExtract = usr/lib/firmware/* !usr/lib/firmware/regulatory.db*
Color
ILoveCandy
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
[alarm]
Include = /etc/pacman.d/mirrorlist
[archlinuxcn]
Server = https://mirrors.cernet.edu.cn/archlinuxcn/$arch
