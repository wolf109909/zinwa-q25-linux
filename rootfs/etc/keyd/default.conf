[ids]
# Q25_Keyboard + Hardware Volume Keys
0001:0001:45028087
0001:0001:d220378b
0001:0001:2ed8c9ca
0001:0001:2cd61f78
0001:0001:de7c590c

[main]
# Green: tap Tab, chord the printed number positions for F1-F12.
send = overload(function, tab)
back = A-left
# Red: stock Phosh overview on tap; one close pulse after 600 ms.
# layerm executes its macro once (unlike a held key or repeating macro).
homepage = timeout(M-d, 600, layerm(close_once, A-f4))
# Berry remains Super: stock Phosh overview, type to search.
leftmeta = layer(meta)
leftalt = overload(shift, oneshot(shift))
leftshift = layer(control)
0 = layer(alt)
rightalt = overload(ralt_sym_layer2, oneshot(ralt_sym_layer2))
rightshift = layer(rshift_layer3)
grave = $

[shift]
leftalt = toggle(shift)
grave = |
back = A-right

[control]
# Printed left Shift is currently Control; retain it, except this Back alias.
back = A-right

[function]
w = f1
e = f2
r = f3
s = f4
d = f5
f = f6
z = f7
x = f8
c = f9
0 = f10
v = f11
b = f12

[close_once]
# Empty held layer: no autorepeat, and no tap action on release.

[ralt_sym_layer2]
rightalt = toggle(ralt_sym_layer2)
leftmouse = rightmouse

q = #
w = 1
e = 2
r = 3
t = (
y = )
u = _
i = -
o = +
p = @

a = *
s = 4
d = 5
f = 6
g = /
h = :
j = ;
k = '
l = "
# Backspace and trackpad arrows/Home inherit their normal navigation actions.

leftalt = tab
z = 7
x = 8
c = 9
v = ?
b = !
n = ,
m = .
grave = mute

0 = 0

[rshift_layer3]
send = sysrq
homepage = A-f4

q = esc
w = pageup
a = home
s = pagedown
d = end

t = command(q25-togglemouse)
y = `
u = <
i = >
o = |
p = =

g = \
h = &
j = {
k = }
l = ^

n = [
m = ]

[control+alt]
homepage = command(q25-togglevt)
