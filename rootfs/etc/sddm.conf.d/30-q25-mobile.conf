# Session choice is isolated so it can be swapped without changing display setup.
[Autologin]
Session=plasma-mobile.desktop

[General]
# KWin seeds 1.25x; greeter-only 0.8x keeps Breeze at native-size 720x720.
# Do not export this to desktop applications or the Mobile lock screen.
GreeterEnvironment=KWIN_DRM_DEVICES=/dev/dri/q25-display,KWIN_FORCE_SW_CURSOR=1,QT_SCALE_FACTOR=0.8
