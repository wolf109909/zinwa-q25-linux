[General]
DisplayServer=wayland
InputMethod=qtvirtualkeyboard
# SDDM filters the service environment; pass these to its greeter explicitly.
GreeterEnvironment=KWIN_DRM_DEVICES=/dev/dri/q25-display,KWIN_FORCE_SW_CURSOR=1

[Theme]
Current=breeze
Font=Noto Sans,10
CursorTheme=breeze_cursors
CursorSize=24

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
EnableHiDPI=true

[Autologin]
# build-rootfs.sh substitutes Q25_USER here. Logout returns to the session chooser.
User=alarm
Session=plasma.desktop
Relogin=false
