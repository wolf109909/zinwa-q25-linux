[Unit]
# The upstream development unit replaces tty1 but runs on tty7.
Conflicts=getty@tty7.service
After=getty@tty7.service

[Service]
# configure substitutes Q25_USER (created with UID 1000).
User=alarm
PAMName=phosh
Environment=XDG_SESSION_CLASS=user
# Match the display controller, not the Panfrost render GPU's card number.
Environment=WLR_DRM_DEVICES=/dev/dri/q25-display
Environment=WLR_NO_HARDWARE_CURSORS=1
