# CCCI starts the firmware; stock ModemManager exclusively owns the AT TTY.
[Unit]
Wants=q25-ccci@ccci_mdinit.service
After=q25-ccci@ccci_mdinit.service

[Service]
# best effort: a modem that never comes up must not take ModemManager down with it
ExecStartPre=-/usr/lib/q25/q25-modem-ready
TimeoutStartSec=180
