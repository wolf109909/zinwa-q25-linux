# One PCM per direction; the "Q25 Output Route" control selects the analog
# path (Speaker/Receiver = MT6358 LINEOUT L -> OCA7255 PA with Music/Receiver
# profile, Headphone = MT6358 HP drivers).

SectionVerb {
	EnableSequence [
		cset "name='Q25 Output Route' Speaker"
		cset "name='Mic Type Mux' ACC"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN2"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	# Stock tuning (vendor PlaybackVolAna "Others,SPK"): LO gain fixed at -2 dB,
	# volume is digital. +8 dB here overdrives the OCA7255 / speaker.
	EnableSequence [
		cset "name='Lineout Volume' 8,8"
		cset "name='Q25 Output Route' Speaker"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	# Stock "Others,RCV": receiver (HS) gain +8 dB, volume digital
	EnableSequence [
		cset "name='Handset Volume' 18"
		cset "name='Q25 Output Route' Receiver"
	]
	DisableSequence [
		cset "name='Q25 Output Route' Speaker"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	# Stock "Others,HS": HP gain fixed at -1 dB, volume digital
	EnableSequence [
		cset "name='Headphone Volume' 9,9"
		cset "name='Q25 Output Route' Headphone"
	]
	DisableSequence [
		cset "name='Q25 Output Route' Speaker"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "PGA"
	}
}
